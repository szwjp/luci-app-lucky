name: Build packages

# Builds lucky + luci-app-lucky as both apk (apk-tools v3) and ipk (opkg)
# without an OpenWrt buildroot or SDK: the script stages the file tree and
# calls `apk mkpkg` / `ipkg-build` directly.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # apk-tools commit that provides `apk mkpkg` with the apk v3 (ADB) writer.
  APK_TOOLS_REF: 'b5a31c0d865342ad80be10d68f1bb3d3ad9b0866'

  # Architectures built by every run. Edit this line to narrow a manual run.
  BUILD_ARCHS: 'arm64 x86_64 armv7 armv6 armv5 mips_softfloat mipsle_softfloat i386'

  # Every run publishes a release. The version is derived from lucky/Makefile
  # as PKG_VERSION-rPKG_RELEASE. Set this only to force a different version;
  # pushing a v* tag overrides it with the tag name.
  RELEASE_VERSION: ''

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      archs: ${{ steps.list.outputs.archs }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve build matrix
        id: list
        run: |
          set -euo pipefail
          json="$(printf '"%s",' $BUILD_ARCHS)"
          echo "archs=[${json%,}]" >> "$GITHUB_OUTPUT"
          echo "架构: $BUILD_ARCHS"

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          # Default to the version the packages themselves carry, so a plain
          # Run workflow produces a release instead of silently skipping it.
          mk_v="$(sed -n 's/^PKG_VERSION:=//p' lucky/Makefile | tr -d '[:space:]')"
          mk_r="$(sed -n 's/^PKG_RELEASE:=//p' lucky/Makefile | tr -d '[:space:]')"
          derived="${mk_v}-r${mk_r:-1}"
          v="${RELEASE_VERSION:-$derived}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$v" ]; then
            echo "::error::无法确定发布版本（lucky/Makefile 里没有 PKG_VERSION）"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "本次运行将发布 release v$v"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.archs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache apk-tools binary
        id: cache-apk-tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /usr/local/bin/apk
          key: apk-tools-${{ env.APK_TOOLS_REF }}-${{ runner.os }}

      - name: Checkout apk-tools
        if: steps.cache-apk-tools.outputs.cache-hit != 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 'alpinelinux/apk-tools'
          path: 'apk-tools'
          ref: ${{ env.APK_TOOLS_REF }}

      - name: Build apk-tools
        if: steps.cache-apk-tools.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential meson ninja-build libssl-dev zlib1g-dev
          pushd apk-tools
          meson setup build \
            -Dcompressed-help=false \
            -Ddocs=disabled \
            -Dhelp=disabled \
            -Dlua=disabled \
            -Ddefault_library=static \
            -Durl_backend=wget \
            -Dzstd=disabled \
            -Dpython=disabled \
            -Dtests=disabled \
            -Dcrypto_backend=openssl
          ninja -C build
          sudo install -m0755 build/src/apk /usr/local/bin/apk
          popd

      - name: Install packaging helpers
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq fakeroot curl
          curl -fsSL -o /tmp/ipkg-build \
            "https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build"
          sudo install -m0755 /tmp/ipkg-build /usr/local/bin/ipkg-build
          apk --version
          ipkg-build 2>&1 | head -1 || true

      - name: Build apk + ipk
        run: |
          set -euo pipefail
          ./scripts/build-pkg.sh \
            --arch "${{ matrix.arch }}" \
            --pkg both \
            --prefix "${{ matrix.arch }}-" \
            --out "$GITHUB_WORKSPACE/dist"

      - name: Verify the built apk files
        run: |
          set -euo pipefail
          # With `set -u`, expanding a glob that matches nothing aborts with a
          # misleading "unbound variable" error, so resolve matches explicitly
          # through compgen and report a real message when a file is missing.
          ls -l dist
          match() { compgen -G "$1" || true; }
          core=()
          while IFS= read -r f; do [ -n "$f" ] && core+=("$f"); done \
            < <(match "dist/${{ matrix.arch }}-lucky-*.apk")
          if [ "${#core[@]}" -ne 1 ]; then
            echo "::error::expected exactly one core apk for ${{ matrix.arch }}, found ${#core[@]}"
            exit 1
          fi
          python3 scripts/apk-verify.py \
            --require-file /usr/bin/lucky \
            --require-file /etc/init.d/lucky \
            "${core[@]}"
          luci=()
          while IFS= read -r f; do [ -n "$f" ] && luci+=("$f"); done \
            < <(match "dist/${{ matrix.arch }}-luci-app-lucky-*.apk")
          if [ "${#luci[@]}" -ne 1 ]; then
            echo "::error::expected exactly one luci-app-lucky apk for ${{ matrix.arch }}, found ${#luci[@]}"
            exit 1
          fi
          python3 scripts/apk-verify.py \
            --arch noarch \
            --require-file /usr/lib/lua/luci/controller/lucky.lua \
            "${luci[@]}"
          # Every po/<lang>/lucky.po must produce an i18n package that carries
          # its compiled catalog at the path LuCI loads it from.
          for po in luci-app-lucky/po/*/lucky.po; do
            [ -f "$po" ] || continue
            lang="$(basename "$(dirname "$po")")"
            case "$lang" in
              zh_Hans) locale=zh-cn ;;
              zh_Hant) locale=zh-tw ;;
              pt_BR) locale=pt-br ;;
              bn_BD) locale=bn ;;
              *) locale="$(echo "$lang" | tr '[:upper:]_' '[:lower:]-')" ;;
            esac
            i18n=()
            while IFS= read -r f; do [ -n "$f" ] && i18n+=("$f"); done \
              < <(match "dist/${{ matrix.arch }}-luci-i18n-lucky-$locale-*.apk")
            if [ "${#i18n[@]}" -ne 1 ]; then
              echo "::error::$lang: expected one luci-i18n-lucky-$locale apk for ${{ matrix.arch }}, found ${#i18n[@]}"
              exit 1
            fi
            python3 scripts/apk-verify.py \
              --arch noarch \
              --name "luci-i18n-lucky-$locale" \
              --require-file "/usr/lib/lua/luci/i18n/lucky.$locale.lmo" \
              "${i18n[@]}"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lucky-${{ matrix.arch }}
          path: |
            dist/*.apk
            dist/*.ipk

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # One directory per artifact (lucky-<arch> -> dist/<arch>) so each
          # architecture can be published as its own release.
          path: dist

      - name: Verify version matches the Makefiles
        run: |
          set -euo pipefail
          ls -l dist
          V="${{ needs.prepare.outputs.version }}"
          MK_V="$(sed -n 's/^PKG_VERSION:=//p' lucky/Makefile | tr -d '[:space:]')"
          MK_R="$(sed -n 's/^PKG_RELEASE:=//p' lucky/Makefile | tr -d '[:space:]')"
          EXPECTED="${MK_V}-r${MK_R:-1}"
          if [ "$V" != "$EXPECTED" ]; then
            echo "::error::发布版本 $V 与 lucky/Makefile 产物版本 $EXPECTED 不一致"
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Publish a release per architecture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archs="$BUILD_ARCHS"

          for a in $archs; do
            mapfile -t files < <(find "dist/$a" -maxdepth 1 -type f \( -name '*.apk' -o -name '*.ipk' \) 2>/dev/null | sort)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "::error::$a: 没有可上传的产物"
              exit 1
            fi

            tag="${a}-${VERSION}"
            body="$RUNNER_TEMP/notes-$a.md"
            {
              echo "lucky \`${VERSION}\` 的 **${a}** 构建。"
              echo
              for f in "${files[@]}"; do
                b="$(basename "$f")"
                # Absolute URL: a relative one renders as
                # /<repo>/blob/<tag>/releases/download/... and 404s.
                echo "- [${b}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${b})"
              done
              echo
              echo "<details><summary>设备侧安装</summary>"
              echo
              echo '```sh'
              echo "apk add --allow-untrusted ./${a}-lucky-${VERSION}.apk ./${a}-luci-app-lucky-${VERSION}.apk ./${a}-luci-i18n-lucky-zh-cn-${VERSION}.apk"
              echo "# 或 opkg install ./${a}-lucky_*_<ipk-arch>.ipk ..."
              echo '```'
              echo
              echo "</details>"
            } > "$body"
            cat "$body"

            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              # Braces are required before the full-width comma: bash otherwise
              # treats the multibyte character as part of the variable name and
              # aborts with "tag: unbound variable" under set -u.
              echo "已存在 ${tag}，先删除后重新发布"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            fi
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$a" \
              --notes-file "$body" \
              "${files[@]}"
          done
